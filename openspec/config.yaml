schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: totoro-game-collect-an-acorn — браузерная игра «Мэй собирает жёлуди».
  Аналог механики Nintendo Game & Watch EG-26 Egg / «Волк ловит яйца» в мире «Мой сосед Тоторо».

  Стек:
    - Один самодостаточный HTML-файл: may-collect-an-acorn.html
    - Vanilla HTML/CSS/JS, без сборки, без CDN, без внешних картинок
    - Пиксель-арт: спрайты из строковых сеток → SVG data-URL в CSS-переменных
    - Открытие в Safari на iPhone (предпочтительно по HTTP; file:// может не выполнять скрипты в «Файлы»)

  Домен:
    - Мэй Кусакабэ — ловит жёлуди (4 позиции: left-up=0, right-up=1, left-down=2, right-down=3)
    - Маленькие Тоторо (чиби/чу) в четырёх углах сбрасывают жёлуди по горизонтальным лоткам к центру
    - Сацуки в окне домика — при промахе, пока она видна, штраф 0.5 вместо 1
    - Сусуватари — маркеры штрафа (полный / мигающий половинный); конец при сумме ≥ 3
    - Большой Тоторо — только на заставке
    - Котобус — пробегает при конце партии
    - Темп: +5% каждые 5 пойманных, потолок 200%; индикатор «темп» в HUD
    - Счёт 0–999; сброс штрафов на 200 и 500; на 999 счёт обнуляется без сброса темпа

  Источники требований: requaments/механика-мэй-собирает-жёлуди.md
  Отладка: .debug-server.py (порт 8765) + логи в игре — не убирать без явной просьбы.
